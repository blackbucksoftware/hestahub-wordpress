name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.6']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  compat:
    name: PHPCompatibility (7.4-)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer compat

  schemas:
    name: Vendored schemas match the published Revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bin/vendor-schemas.sh --check

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor. The WordPress test suite caps PHPUnit at 9, and
          # composer.lock is resolved for PHP 7.4, so this leg runs PHPUnit 9.
          - php: '7.4'
            wp: '6.8'
          - php: '8.6'
            wp: latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}
      - run: composer test
      - name: Tests on multisite
        run: composer test
        env:
          WP_MULTISITE: '1'
