name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Build the zip and the update manifest
        run: bin/build-zip.sh "$GITHUB_REF_NAME"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The update channel reads hestahub.json from the latest release, so
        # the manifest goes up together with the zip it points at.
        run: gh release create "$GITHUB_REF_NAME" build/hestahub-*.zip build/hestahub.json --verify-tag --generate-notes
